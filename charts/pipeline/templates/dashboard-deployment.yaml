apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
    {{- include "pipeline.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ include "pipeline.image" . }}
          command:
            - streamlit
            - run
            - dashboard/app.py
            - --server.port
            - "8501"
            - --server.address
            - 0.0.0.0
          ports:
            - containerPort: 8501
              name: http
          # Only talks to the api over HTTP: no db credentials mounted.
          env:
            - name: API_BASE
              value: http://api:8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
