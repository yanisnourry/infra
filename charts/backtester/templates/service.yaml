# ClusterIP only, no Ingress: the only caller is the site, from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: backtester
  labels:
    app: backtester
    {{- include "backtester.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: backtester
  ports:
    - name: http
      port: 8000
      targetPort: http
