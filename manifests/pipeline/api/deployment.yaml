apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pipeline
  labels:
    app: api
spec:
  # The ingestion scheduler runs inside the api process: more than one pod
  # (including during a rolling update) would ingest every candle twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-db
          image: timescale/timescaledb:2.30.1-pg16
          command:
            - sh
            - -c
            - "until pg_isready -h timescaledb -p 5432; do sleep 2; done"
      containers:
        - name: api
          image: ghcr.io/yanisnourry/market-data-pipeline:09efb3fd584be213b0bac269b66abd2dbe4c3f8b
          command:
            - uvicorn
            - api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pipeline-settings
            - secretRef:
                name: pipeline-credentials
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # TCP only: restarting the api would not fix a db/redis outage and
          # would restart the scheduler, so dependencies stay out of liveness.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
